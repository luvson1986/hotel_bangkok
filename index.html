<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>호텔비 정산</title>
<style>
/* 레이아웃: 한 칼럼 모바일 우선. 입력 두 칸 → 결제 방법 세 가지(카드) → 자동 적용 값 → 일별 체크. 결제 방법은 이름과 초과 확률로 고른다. */
:root{--bg:#f4f6f8;--fg:#14191f;--muted:#5e6975;--card:#ffffff;--line:#dde2e8;--accent:#1f4fc4;--accent-fg:#ffffff;--bad:#b3232b;--warn:#8a5300;--warn-bg:#fdf0d8;--mid:#1f4fc4;--mid-bg:#e6edfb;--ok:#17683a;--ok-bg:#dff3e7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1317;--fg:#e9edf1;--muted:#98a3ae;--card:#181d23;--line:#29313a;--accent:#7ea3ff;--accent-fg:#0b1220;--bad:#ff8087;--warn:#f2b25c;--warn-bg:#3a2b12;--mid:#9bb8ff;--mid-bg:#1c2a4a;--ok:#6fd79a;--ok-bg:#163424;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1317;--fg:#e9edf1;--muted:#98a3ae;--card:#181d23;--line:#29313a;--accent:#7ea3ff;--accent-fg:#0b1220;--bad:#ff8087;--warn:#f2b25c;--warn-bg:#3a2b12;--mid:#9bb8ff;--mid-bg:#1c2a4a;--ok:#6fd79a;--ok-bg:#163424;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:8px 0 4px;text-wrap:balance}
h2{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600;letter-spacing:.02em}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--muted)}
input[type=text]{width:100%;font:inherit;font-variant-numeric:tabular-nums;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin-top:4px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;padding:12px 14px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-fg);width:100%;margin-top:12px;cursor:pointer}
.label{color:var(--muted);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv span:last-child{text-align:right}
.note{color:var(--muted);font-size:13px;margin:10px 0 0}
.err{color:var(--bad);font-size:14px;margin:10px 0 0}
.warnmsg{color:var(--bad);font-size:13px;margin:10px 0 0}
#result{display:flex;flex-direction:column;gap:12px}
#result h2{margin:4px 0 0}
.opt-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.opt-name{font-size:17px;font-weight:700}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tone-warn .chip{background:var(--warn-bg);color:var(--warn)}
.tone-ok .chip{background:var(--ok-bg);color:var(--ok)}
.tag{color:var(--muted);font-size:13px;margin:2px 0 12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.2}
.big small{font-size:13px;color:var(--muted);font-weight:500}
.odds{font-size:13px;color:var(--muted);margin:8px 0 0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 4px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;border-top:0}
.chartwrap{position:relative}
#cv{width:100%;height:auto;display:block;touch-action:pan-y}
.grid{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.endlabel{fill:var(--fg);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);font-size:12px;line-height:1.4;padding:6px 8px;border-radius:6px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;width:auto;margin:0;padding:8px 10px;background:transparent;color:var(--muted);font-size:14px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
</style>
</head>
<body>
<main>
  <h1>호텔비 정산</h1>

  <section>
    <div class="row">
      <label for="nights">박수<input type="text" id="nights" inputmode="numeric" placeholder="예: 6"></label>
      <label for="totalThb">호텔 총액 (THB)<input type="text" id="totalThb" inputmode="decimal" placeholder="예: 40800"></label>
    </div>
    <button id="settle" type="button">정산하기</button>
    <p class="err" id="error" hidden></p>
  </section>

  <div id="result" hidden>
    <h2 id="resultTitle">결제 방법 고르기</h2>
    <div id="options" style="display:flex;flex-direction:column;gap:12px"></div>
    <p class="note" id="resultNote"></p>
  </div>

  <section>
    <h2>적용 값 (자동)</h2>
    <div class="kv"><span>박당 상한</span><span id="aCap"></span></div>
    <div class="kv"><span>회사 기준환율</span><span id="aUsd"></span></div>
    <div class="kv"><span>시장 환율</span><span id="aThb"></span></div>
    <div class="kv"><span>카드 수수료율</span><span id="aFee"></span></div>
    <p class="note" id="rateInfo">환율 불러오는 중...</p>
    <p class="warnmsg" id="stale" hidden></p>
  </section>

  <section>
    <h2>일별 체크 (박당 법카 최대, 가장 든든한 결제 기준)</h2>
    <div class="tabs" role="tablist" aria-label="일별 체크 보기 방식">
      <button type="button" role="tab" id="tabChart" aria-selected="true" aria-controls="panelChart">그래프</button>
      <button type="button" role="tab" id="tabTable" aria-selected="false" aria-controls="panelTable" tabindex="-1">표</button>
    </div>
    <div id="panelChart" role="tabpanel" aria-labelledby="tabChart">
      <div class="chartwrap">
        <div id="chart"></div>
        <div id="tip" class="tip" hidden></div>
      </div>
      <p class="note" id="chartNote"></p>
    </div>
    <div id="panelTable" role="tabpanel" aria-labelledby="tabTable" hidden>
      <div class="tbl">
        <table>
          <thead><tr><th>날짜</th><th>법카 최대 (THB/박)</th><th>전일 대비</th></tr></thead>
          <tbody id="log"></tbody>
        </table>
      </div>
      <p class="note">▲는 전날보다 법카로 더 결제할 수 있다는 뜻이고, ▼는 줄었다는 뜻이에요. 개인카드 금액은 이 값에서 정해져요.</p>
    </div>
  </section>
</main>

<script>
// 환율은 열 때마다 frankfurter(ECB 기준)에서 불러온다. 실패하면 아래 저장값으로 계산한다.
  var FALLBACK = {
    '2026-09-21': { usdKrw: 1372.18, usd2thb: 33.235 },
    '2026-09-22': { usdKrw: 1356.15, usd2thb: 33.14 },
    '2026-09-23': { usdKrw: 1365.35, usd2thb: 33.29 },
    '2026-09-24': { usdKrw: 1368.6, usd2thb: 33.48 },
    '2026-09-25': { usdKrw: 1355.05, usd2thb: 33.345 },
    '2026-09-28': { usdKrw: 1357.93, usd2thb: 33.57 },
    '2026-09-29': { usdKrw: 1353.36, usd2thb: 33.515 },
    '2026-09-30': { usdKrw: 1355.4, usd2thb: 33.565 },
    '2026-10-01': { usdKrw: 1361.27, usd2thb: 33.655 },
    '2026-10-02': { usdKrw: 1348.28, usd2thb: 33.595 },
    '2026-10-05': { usdKrw: 1343.98, usd2thb: 33.695 },
    '2026-10-06': { usdKrw: 1338.78, usd2thb: 33.575 },
    '2026-10-07': { usdKrw: 1338.69, usd2thb: 33.695 },
    '2026-10-08': { usdKrw: 1343.46, usd2thb: 33.685 },
    '2026-10-09': { usdKrw: 1341.49, usd2thb: 33.53 },
    '2026-10-12': { usdKrw: 1333.09, usd2thb: 33.615 },
    '2026-10-13': { usdKrw: 1341.45, usd2thb: 33.59 },
    '2026-10-14': { usdKrw: 1336.79, usd2thb: 33.575 },
    '2026-10-15': { usdKrw: 1345.9, usd2thb: 33.54 },
    '2026-10-16': { usdKrw: 1332.1, usd2thb: 33.415 },
    '2026-10-19': { usdKrw: 1329.49, usd2thb: 33.555 },
    '2026-10-20': { usdKrw: 1327.84, usd2thb: 33.65 },
    '2026-10-21': { usdKrw: 1325.57, usd2thb: 33.575 },
    '2026-10-22': { usdKrw: 1324.63, usd2thb: 33.745 },
    '2026-10-23': { usdKrw: 1324.45, usd2thb: 33.745 },
    '2026-10-26': { usdKrw: 1325.28, usd2thb: 33.805 },
    '2026-10-27': { usdKrw: 1327.75, usd2thb: 33.77 },
    '2026-10-28': { usdKrw: 1340.47, usd2thb: 33.775 },
    '2026-10-29': { usdKrw: 1337.29, usd2thb: 33.755 },
    '2026-10-30': { usdKrw: 1335.27, usd2thb: 33.73 }
  };

function main(SERIES, live) {

  var CAP_USD = 200;
  var SAFEST_MARGIN = 0.005;
  // m: 기준 안전마진. 개인카드 결제액을 STEP(바트) 단위로 맞추며, 아슬아슬은 가장 가까운 단위로(마진 FLOOR_MARGIN 미만 불가),
  // 든든은 올림으로 맞춰 기준 마진 아래로 내려가지 않게 한다.
  var STEP = 100;
  var FLOOR_MARGIN = 0.002;
  var OPTIONS = [
    { m: 0.003, mode: 'nearest', tone: 'warn', name: '아슬아슬 최소 결제', tag: '개인카드를 가장 적게 쓰는 선택이에요. 대신 한도에 바짝 붙어요.' },
    { m: 0.005, mode: 'up', tone: 'ok', name: '가장 든든한 결제', tag: '둘 중 더 안전해요. 개인카드를 조금 더 쓰는 대신 여유를 남겨요.' }
  ];
  // 최근 1년(2025-10-31~2026-10-30) 환율에서 4영업일 사이 바트가 달러 대비 강해진 비율. 음수는 유리하게 움직인 경우.
  var DRIFT = [-0.00077,0.00416,0.00615,0.00277,-0.00325,0.00093,-0.00201,-0.00123,0.00123,-0.00387,-0.00077,0.00062,0.0004,0.00462,0.00648,0.00693,0.00639,0.011,0.00621,0.0104,0.00435,0.00235,0.00515,0.0011,0.00655,0.00345,0.00973,0.01193,0.01146,0.00725,0.00269,0.00048,0.01048,0.01285,0.01303,0.00064,-0.00851,-0.01816,-0.01111,0.00207,0.00462,0.01089,-0.00478,-0.00287,0.00144,-0.00463,0.00206,0.00222,-0.00721,0.00699,0.01239,0.01045,0.00382,0.00288,-0.00209,0.00103,0.00702,-0.00112,-0.00883,-0.01869,-0.01463,-0.01388,-0.01114,0.00047,0.01236,0.01258,0.02172,0.01899,0.00321,0.00448,-0.00708,-0.00806,-0.00547,-0.00354,0.00894,0.00624,0.0048,0.00465,-0.00193,-0.01465,-0.02139,-0.01352,-0.01866,-0.01476,-0.00976,-0.00461,-0.00316,0.00125,-0.00405,-0.02324,-0.01747,-0.02286,-0.02189,-0.01236,0.00201,0.00015,0.00957,-0.00427,-0.02155,-0.00597,-0.00522,0.01185,0.00561,0.00746,0.02701,0.01277,0.0203,0.00981,-0.00533,0,0.00358,0.00666,-0.00094,0.00187,-0.00688,-0.00873,-0.00935,-0.00818,-0.01087,-0.00927,-0.00525,-0.01016,-0.00261,0.01439,0.01229,0.01232,0.00689,-0.0073,-0.00591,-0.00286,-0.00787,-0.0054,-0.01005,-0.01114,-0.00046,-0.00215,0.00551,0.00046,0.00199,-0.00107,-0.00123,0.00321,0.00107,-0.00076,-0.00252,-0.00246,-0.00552,-0.00321,-0.01083,-0.00965,0.00061,0.00853,0.01335,0.01017,-0.00137,-0.00952,-0.01215,-0.01794,-0.01952,-0.01643,-0.01413,-0.00136,0.00598,0.00045,0.0018,0.00331,-0.00286,0.00374,-0.0039,-0.00936,0.0003,-0.00376,-0.00239,-0.00598,-0.0075,-0.00749,-0.00298,-0.00059,-0.0073,-0.00565,-0.00193,0.00252,0.00592,0.00872,0.0043,0.00342,0.00818,0.00582,0.01207,0.01195,0.0084,0.00966,0.00106,0.00015,-0.00227,-0.00339,0.00242,0,0.00196,0.00634,0.0106,0.01134,0.00998,0.00516,-0.00551,-0.00826,-0.01314,-0.01588,-0.01126,-0.00091,0.00739,0.01112,0.00933,0.00333,-0.00228,-0.00517,-0.01018,-0.01278,-0.00773,-0.00726,-0.00316,0.0018,0.00331,0.00045,-0.00375,-0.00331,-0.01298,-0.00676,-0.00254,-0.0093,-0.00074,-0.00537,-0.0003,-0.00119,-0.00268,0.0049,-0.00119,0.00312,0.00327,-0.0003,0.00595,0.00104,-0.00223,-0.00104,-0.00988,-0.00566,-0.00461,-0.00581,-0.00089,-0.0003,0.00222];
  // 카드 수수료율(해외결제 수수료 + 환율 스프레드). 지난 출장 청구 내역으로 보정한 값.
  var FEE = 0.0192;
  var STORE = 'hotel.inputs';

  function $(id) { return document.getElementById(id); }
  function num(v) { var n = parseFloat(String(v).replace(/,/g, '')); return isFinite(n) ? n : NaN; }
  function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }

  function split(p) {
    var limitKrw = p.capUsd * p.nights * p.usdKrw;
    var unit = p.thbKrw * (1 + p.feeRate + p.margin);
    var corpMaxThb = Math.floor(limitKrw / unit);
    var corpThb = p.totalThb == null ? corpMaxThb : Math.min(corpMaxThb, p.totalThb);
    var expectedKrw = Math.round(corpThb * unit);
    return {
      limitKrw: limitKrw, corpMaxThb: corpMaxThb, corpThb: corpThb,
      personalThb: p.totalThb == null ? null : p.totalThb - corpThb,
      expectedKrw: expectedKrw, headroomKrw: Math.round(limitKrw - corpThb * unit)
    };
  }

  function thbKrwOf(d) { return d.usdKrw / d.usd2thb; }

  var dates = Object.keys(SERIES).sort();
  var latestDate = dates[dates.length - 1];
  var latest = SERIES[latestDate];
  var fee = FEE;

  $('aCap').textContent = '$' + CAP_USD + ' / 박';
  $('aUsd').textContent = latest.usdKrw.toFixed(2) + '원/USD';
  $('aThb').textContent = thbKrwOf(latest).toFixed(4) + '원/THB';
  $('aFee').textContent = (fee * 100).toFixed(2) + '% (지난 출장 기준)';
  $('rateInfo').textContent = '환율 기준일 ' + latestDate + (live ? ' (ECB, 방금 조회)' : ' (조회 실패, 저장된 값 사용)');

  var days = Math.floor((Date.now() - new Date(latestDate + 'T00:00:00Z').getTime()) / 86400000);
  if (days > 4) {
    $('stale').textContent = '환율이 ' + days + '일 전 기준입니다.' + (live ? '' : ' 새로고침해서 다시 불러와 보세요.');
    $('stale').hidden = false;
  }

  // 든든한 결제의 마진: 최근 30영업일 중 4영업일 사이 법카 최대(원/USD÷원/THB, 곧 USD/THB)가 가장 크게 줄어든 폭. 최소 FLOOR_MARGIN.
  var dyn = FLOOR_MARGIN;
  for (var k = 0; k + 4 < dates.length; k++) {
    dyn = Math.max(dyn, -(SERIES[dates[k + 4]].usd2thb / SERIES[dates[k]].usd2thb - 1));
  }
  SAFEST_MARGIN = dyn;
  OPTIONS[1].m = dyn;
  OPTIONS[1].tag = '최근 ' + dates.length + '영업일에 가장 크게 흔들린 폭(' + (dyn * 100).toFixed(2) + '%)까지 견디게 맞췄어요. 개인카드를 조금 더 쓰는 대신 여유를 남겨요.';

  var rows = dates.map(function (d) {
    var r = SERIES[d];
    var one = split({ capUsd: CAP_USD, nights: 1, usdKrw: r.usdKrw, thbKrw: thbKrwOf(r), feeRate: fee, margin: SAFEST_MARGIN, totalThb: null });
    return { date: d, v: one.corpMaxThb, usd: r.usdKrw, thb: thbKrwOf(r) };
  });
  rows.forEach(function (r, i) {
    var q = rows[i - 1];
    r.dV = q ? r.v / q.v - 1 : null;
  });
  function pct(x) {
    if (x === null) return '-';
    var t = (Math.abs(x) * 100).toFixed(2) + '%';
    return x > 0.00005 ? '▲ +' + t : x < -0.00005 ? '▼ −' + t : '0.00%';
  }
  $('log').innerHTML = rows.slice().reverse().map(function (r) {
    return '<tr><td>' + r.date + '</td><td>' + fmt(r.v) + '</td><td>' + pct(r.dV) + '</td></tr>';
  }).join('');

  function niceStep(range, ticks) {
    var raw = range / ticks, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var m = [1, 2, 5, 10].filter(function (k) { return k * mag >= raw; })[0];
    return m * mag;
  }

  function drawChart() {
    var W = 320, H = 190, L = 46, R = 16, T = 18, B = 26, n = rows.length;
    var vs = rows.map(function (r) { return r.v; });
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    var step = niceStep(hi - lo || 1, 4);
    var y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
    if (y1 === y0) y1 += step;
    function X(i) { return L + (W - L - R) * i / (n - 1); }
    function Y(v) { return T + (H - T - B) * (1 - (v - y0) / (y1 - y0)); }
    var svg = '<svg id="cv" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="날짜별 박당 법카 최대 결제 가능 바트">';
    for (var t = y0; t <= y1 + 1e-9; t += step) {
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(t) + '" y2="' + Y(t) + '" class="grid"/>' +
        '<text x="' + (L - 6) + '" y="' + (Y(t) + 3) + '" text-anchor="end" class="ax">' + fmt(t) + '</text>';
    }
    [0, Math.floor((n - 1) / 2), n - 1].forEach(function (i, k) {
      svg += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="' + (k === 0 ? 'start' : k === 2 ? 'end' : 'middle') + '" class="ax">' +
        rows[i].date.slice(5).replace('-', '/') + '</text>';
    });
    svg += '<path d="' + rows.map(function (r, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(r.v).toFixed(1); }).join('') + '" class="line"/>';
    var last = rows[n - 1];
    svg += '<circle cx="' + X(n - 1) + '" cy="' + Y(last.v) + '" r="4.5" class="dot"/>' +
      '<text x="' + X(n - 1) + '" y="' + (Y(last.v) - 9) + '" text-anchor="end" class="endlabel">' + fmt(last.v) + '</text>' +
      '<line id="cx" y1="' + T + '" y2="' + (H - B) + '" class="cross" hidden/><circle id="cd" r="4.5" class="dot" hidden/>' +
      '<rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - B) + '" fill="transparent" id="hit"/></svg>';
    $('chart').innerHTML = svg;

    var tip = $('tip'), cx = $('cx'), cd = $('cd'), cv = $('cv');
    function show(ev) {
      var rect = cv.getBoundingClientRect();
      var x = (ev.clientX - rect.left) / rect.width * W;
      var i = Math.max(0, Math.min(n - 1, Math.round((x - L) / (W - L - R) * (n - 1))));
      var r = rows[i], px = X(i), py = Y(r.v);
      cx.setAttribute('x1', px); cx.setAttribute('x2', px); cx.hidden = false;
      cd.setAttribute('cx', px); cd.setAttribute('cy', py); cd.hidden = false;
      tip.innerHTML = '<b>' + r.date + '</b><br>법카 최대 ' + fmt(r.v) + ' THB/박<br>전일 대비 ' + pct(r.dV);
      tip.hidden = false;
      var left = Math.max(80, Math.min(rect.width - 80, px / W * rect.width));
      tip.style.left = left + 'px';
      tip.style.top = Math.max(0, py / H * rect.height - 8) + 'px';
    }
    function hide() { cx.hidden = true; cd.hidden = true; tip.hidden = true; }
    var hit = $('hit');
    hit.addEventListener('pointermove', show);
    hit.addEventListener('pointerdown', show);
    hit.addEventListener('pointerleave', hide);

    var best = rows.reduce(function (a, r) { return r.v > a.v ? r : a; }, rows[0]);
    var worst = rows.reduce(function (a, r) { return r.v < a.v ? r : a; }, rows[0]);
    $('chartNote').textContent = '최근 ' + n + '영업일. 높을수록 법카로 더 많이 결제할 수 있어요. 최고 ' + fmt(best.v) + '(' + best.date.slice(5).replace('-', '/') +
      ') · 최저 ' + fmt(worst.v) + '(' + worst.date.slice(5).replace('-', '/') + '), 차이 ' + fmt(best.v - worst.v) + ' THB.';
  }
  drawChart();

  function selectTab(which) {
    var isChart = which === 'chart';
    $('tabChart').setAttribute('aria-selected', isChart);
    $('tabTable').setAttribute('aria-selected', !isChart);
    $('tabChart').tabIndex = isChart ? 0 : -1;
    $('tabTable').tabIndex = isChart ? -1 : 0;
    $('panelChart').hidden = !isChart;
    $('panelTable').hidden = isChart;
  }
  $('tabChart').addEventListener('click', function () { selectTab('chart'); });
  $('tabTable').addEventListener('click', function () { selectTab('table'); });
  [$('tabChart'), $('tabTable')].forEach(function (b) {
    b.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        var next = b === $('tabChart') ? 'table' : 'chart';
        selectTab(next);
        $(next === 'chart' ? 'tabChart' : 'tabTable').focus();
      }
    });
  });

  function showError(msg) {
    $('error').textContent = msg;
    $('error').hidden = false;
    $('result').hidden = true;
  }

  // 개인카드 결제액을 STEP 단위로 맞추고, 그 결과 실제로 남는 마진과 초과 확률을 구한다.
  function plan(o, nights, total) {
    var thbKrw = thbKrwOf(latest);
    var limit = CAP_USD * nights * latest.usdKrw;
    function marginOf(corp) { return corp > 0 ? limit / (corp * thbKrw) - 1 - fee : Infinity; }
    var personal = split({ capUsd: CAP_USD, nights: nights, usdKrw: latest.usdKrw, thbKrw: thbKrw, feeRate: fee, margin: o.m, totalThb: total }).personalThb;
    if (personal > 0) {
      var steps = personal / STEP;
      personal = (o.mode === 'up' ? Math.ceil(steps) : Math.round(steps)) * STEP;
      if (o.mode !== 'up') while (personal < total && marginOf(total - personal) < FLOOR_MARGIN) personal += STEP;
      personal = Math.min(personal, total);
    }
    var corp = total - personal;
    var margin = marginOf(corp);
    var over = DRIFT.filter(function (d) { return d > margin; });
    var avgOver = over.length ? over.reduce(function (a, d) { return a + d - margin; }, 0) / over.length * limit : 0;
    var expectedKrw = Math.round(corp * thbKrw * (1 + fee));
    return {
      corp: corp, personal: personal, margin: margin, p: Math.round(100 * over.length / DRIFT.length),
      avgOver: Math.max(1000, Math.round(avgOver / 1000) * 1000),
      expectedKrw: expectedKrw, headroomKrw: Math.round(limit - expectedKrw)
    };
  }

  function card(o, r) {
    var inside = r.personal === 0;
    var odds = inside ? '총액이 한도 안이라 전부 법카로 결제해도 돼요.'
      : r.p === 0 ? '지난 1년 환율로는 넘은 적이 없어요.'
      : '열 번 중 ' + Math.max(1, Math.round(r.p / 10)) + '번쯤 넘을 수 있고, 넘어도 평균 약 ' + fmt(r.avgOver) + '원이에요.';
    return '<section class="tone-' + o.tone + '">' +
      '<div class="opt-head"><span class="opt-name">' + o.name + '</span><span class="chip">초과 확률 ' + r.p + '%</span></div>' +
      '<p class="tag">' + o.tag + '</p>' +
      '<div class="pair">' +
        '<div><div class="label">법카로 결제</div><div class="big">' + fmt(r.corp) + ' <small>THB</small></div></div>' +
        '<div><div class="label">개인카드로 결제</div><div class="big">' + fmt(r.personal) + ' <small>THB</small></div></div>' +
      '</div>' +
      '<div class="kv"><span>예상 법카 청구 (오늘 환율)</span><span>' + fmt(r.expectedKrw) + '원</span></div>' +
      '<div class="kv"><span>한도 대비 여유</span><span>' + fmt(r.headroomKrw) + '원</span></div>' +
      '<div class="kv"><span>견딜 수 있는 환율 변동</span><span>' + (isFinite(r.margin) ? (r.margin * 100).toFixed(2) + '%' : '-') + '</span></div>' +
      '<p class="odds">' + odds + '</p>' +
      '</section>';
  }

  function settle() {
    try { localStorage.setItem(STORE, JSON.stringify({ n: $('nights').value, t: $('totalThb').value })); } catch (e) {}
    var nights = num($('nights').value);
    var total = num($('totalThb').value);
    if (!(nights > 0)) return showError('박수를 입력하세요');
    if (!(total > 0)) return showError('호텔 총액을 입력하세요');
    $('error').hidden = true;
    $('result').hidden = false;
    $('resultTitle').textContent = '결제 방법 고르기 · ' + nights + '박 · ' + fmt(total) + ' THB';
    $('options').innerHTML = OPTIONS.map(function (o) { return card(o, plan(o, nights, total)); }).join('');
    $('resultNote').textContent = '개인카드 결제액은 ' + STEP + '바트 단위로 맞췄어요. 초과 확률은 맞춘 금액에서 다시 계산했고, 넘더라도 그 차액만 개인카드로 내면 돼요.';
  }

  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved) { $('nights').value = saved.n || ''; $('totalThb').value = saved.t || ''; }
  } catch (e) {}
  ['nights', 'totalThb'].forEach(function (id) {
    $(id).addEventListener('input', function () { $('result').hidden = true; });
  });
  $('settle').addEventListener('click', settle);
}

function loadSeries() {
  var start = new Date(Date.now() - 50 * 86400000).toISOString().slice(0, 10);
  return fetch('https://api.frankfurter.dev/v1/' + start + '..?from=USD&to=KRW,THB')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) {
      var out = {};
      Object.keys(j.rates).sort().slice(-30).forEach(function (k) {
        var x = j.rates[k];
        if (x.KRW > 0 && x.THB > 0) out[k] = { usdKrw: x.KRW, usd2thb: x.THB };
      });
      if (Object.keys(out).length < 2) throw new Error('empty');
      return out;
    });
}
loadSeries().then(function (series) { main(series, true); }, function () { main(FALLBACK, false); });
</script>
